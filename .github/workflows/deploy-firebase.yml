name: Deploy calendar to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check multi-day date logic
        run: node --experimental-strip-types --test tests/date-range.test.mjs tests/month-layout.test.mjs
      - name: Build calendar
        run: npm run build
      - name: Check deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Add FIREBASE_SERVICE_ACCOUNT in repository Settings > Secrets and variables > Actions. See GITHUB_DEPLOY.md.'
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publish Firestore rules and website
        run: npx --no-install firebase deploy --only firestore:rules,hosting --project calendar-app-68060 --non-interactive
